name: Pubblica il questionario VALTURA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Recupera il sito
        uses: actions/checkout@v6
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Carica il sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
